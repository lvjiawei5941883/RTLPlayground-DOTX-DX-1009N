name: Build DOTX KEEPLINK FG-4GT-2SX

# 只保留手动/被 sync-upstream.yml 调用触发，避免 merge 上游时重复构建
on:
  workflow_dispatch:
    inputs:
      force:
        description: '源码与上次构建相同时也强制重编'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 先比对当前 commit 与上次 release 记录的 commit，避免手动重复 dispatch 生成空 diff 的 release
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with last release commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          set -u
          cur="${{ github.sha }}"
          prev=$(gh release view --json body -q .body 2>/dev/null | grep -oE '\b[0-9a-f]{40}\b' | head -1 || true)
          echo "current  = $cur"
          echo "previous = ${prev:-<none>}"
          if [ "${FORCE:-false}" != "true" ] && [ -n "$prev" ] && [ "$prev" = "$cur" ]; then
            echo "run_build=false" >> "$GITHUB_OUTPUT"
            echo "源码与上次构建一致，跳过编译（需要重编请手动勾选 force）"
          else
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          # oem=true 表示该机型支持原厂 Web 界面升级（Managed=Yes 且 flash 足够）
          # keepLINK KP-9000-9XHML-X，PCB 丝印 2M-PCB23-V3.1（管理页报 V3.1），2M flash
          - machine: KEEPLINK_KP_9000_9XHML_X_V3_1
            oem: true
          # DOTX DX-1009N，PCB-SWTG118AS-V1.0-11430，512K flash，只能编程器刷
          # oem=false：540KB 的升级包物理上装不进 512KB flash，不产出该文件
          - machine: DOTX_DX_1009N
            oem: false
          # 兮克 SKS3200M-8GPY1XF，PCB-SWTG118AS-V2.1-17462，2M flash，备用，暂不刷可注释
          - machine: XIKESTOR_SKS3200M_8GPY1XF
            oem: true
          # .11：主板丝印 FG-4GT-2SX / FG-4GT-2SX_V2.0，平台 SWGT024AS v2.0，RTL8372N，P25Q32SH 4MB flash
          # 原厂固件为非网管版本（无 Web 界面），首次刷入只能靠编程器/SOIC 夹 → oem=false
          - machine: SWGT024_V2_0_UNMANAGED
            oem: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y make gcc g++ pkg-config bison flex libboost-dev \
            patch bzip2 curl ca-certificates xxd jq python-is-python3 \
            libjson-c-dev zlib1g-dev

      - name: Cache patched SDCC toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: sdcc-${{ hashFiles('sdcc/*') }}

      - name: Build firmware image (512 KiB full flash)
        run: make CI=1 MACHINE=${{ matrix.machine }}

      - name: Build OEM web-installer image
        if: matrix.oem == true
        run: make -C installer

      - name: Stage artifacts
        run: |
          set -e
          mkdir -p stage
          cp output/${{ matrix.machine }}/rtlplayground-*.bin stage/
          if [ "${{ matrix.oem }}" = "true" ]; then
            cp installer/output/rtlplayground_oem_upgrade.bin \
               "stage/rtlplayground_oem_upgrade_${{ matrix.machine }}.bin"
          fi
          ls -l stage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.machine }}
          path: stage/*.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 必须先 checkout：actions/checkout 默认 clean=true 会 git clean -ffdx 清空工作区，
      # 若放在 Download artifacts 之后执行，会把刚下载的 artifacts/ 里的 bin 全部删掉，
      # 导致 Publish release 报 "Pattern 'artifacts/*.bin' does not match any files"
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -l artifacts

      - name: Stamp release name (Asia/Shanghai)
        id: stamp
        run: |
          echo "tag=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M')"        >> "$GITHUB_OUTPUT"
          echo "display=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Build release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          cur="${{ github.sha }}"
          prev=$(gh release view --json body -q .body 2>/dev/null | grep -oE '\b[0-9a-f]{40}\b' | head -1 || true)

          {
            echo "编译时间 \`${{ steps.stamp.outputs.display }}\`（北京时间）　源码 \`${cur:0:7}\`"
            echo ""
            if [ -n "$prev" ] && git cat-file -e "${prev}^{commit}" 2>/dev/null; then
              n=$(git rev-list --count "$prev..$cur")
              if [ "$n" -gt 0 ]; then
                echo "### 相比上次构建 \`${prev:0:7}\`：$n 个提交"
                echo ""
                echo '```'
                git log --oneline --no-merges "$prev..$cur" | head -20
                if [ "$n" -gt 20 ]; then
                  echo "... 另有 $((n - 20)) 个提交未列出"
                fi
                echo '```'
              else
                echo "源码与上次构建 \`${prev:0:7}\` 一致，本次仅重新编译。"
              fi
            else
              echo "### 首次生成，无对比基线"
              echo ""
              echo '```'
              git log --oneline --no-merges -10 "$cur"
              echo '```'
            fi
            echo ""
            echo "Machines: \`KEEPLINK_KP_9000_9XHML_X_V3_1\`, \`DOTX_DX_1009N\`, \`XIKESTOR_SKS3200M_8GPY1XF\`, \`SWGT024_V2_0_UNMANAGED\`"
            echo ""
            echo "| 文件 | 用途 |"
            echo "| --- | --- |"
            echo "| \`rtlplayground-v*-<MACHINE>.bin\` | 524288 B 整片镜像：编程器/SOIC 夹直刷；已是 RTLPlayground 的设备用它网页升级 |"
            echo "| \`rtlplayground_oem_upgrade_<MACHINE>.bin\` | 原厂固件网页升级专用，只在原厂 Web 界面刷一次；已是 RTLPlayground 的设备不要用。仅 Managed=Yes 机型产出 |"
            echo ""
            echo "首次刷入前请用编程器完整备份原厂 512 KiB 整片镜像。"
            echo ""
            echo "<!-- base-commit: $cur -->"
          } > body.md

          echo "----- body.md 预览 -----"
          cat body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stamp.outputs.tag }}
          name: ${{ steps.stamp.outputs.display }} 编译
          make_latest: true
          body_path: body.md
          files: artifacts/*.bin
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # 只保留最近 KEEP 个 release，旧的连 tag 一起删
      - name: Prune old releases (keep latest 2)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: '2'
        run: |
          set -uo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" > /tmp/old.txt
          if [ ! -s /tmp/old.txt ]; then
            echo "nothing to prune"
            exit 0
          fi
          while read -r tag; do
            [ -z "$tag" ] && continue
            echo "deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag || echo "skip $tag"
          done < /tmp/old.txt
