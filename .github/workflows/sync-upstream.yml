name: Sync upstream and build

on:
  schedule:
    - cron: '0 23 * * *'      # UTC 23:00 = 北京时间次日 07:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        id: sync
        run: |
          set -eo pipefail
          before=$(git rev-parse HEAD)

          git remote add upstream https://github.com/logicog/RTLPlayground.git 2>/dev/null || true
          git fetch --no-tags upstream main

          if ! git merge --no-edit upstream/main -m "Sync upstream/main ($(TZ=Asia/Shanghai date +%F))"; then
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                .github/workflows/build.yml)
                  git rm -q -f "$f" ;;
                machine/machines.json)
                  # 机型表冲突：整份取上游最新版（不丢上游任何新机型），
                  # fork 自建机型稍后由下方 jq 步骤幂等补回
                  git checkout --theirs -- "$f"
                  git add "$f"
                  echo "machines.json conflict -> adopt upstream version" ;;
                *)
                  echo "::error::unexpected conflict in $f -- 需人工处理"
                  git merge --abort
                  exit 1 ;;
              esac
            done
            git commit --no-edit
          fi

          # fork 里永不保留上游 build.yml：它不产固件，只会在 Actions 里刷屏
          if [ -e .github/workflows/build.yml ]; then
            git rm -q .github/workflows/build.yml
            git commit -m "chore: drop upstream build.yml (no artifacts, useless in this fork)"
          fi

          # 幂等补回 fork 自建机型：上游无论怎么改 machines.json，这里都能兜住
          if ! jq -e 'any(.[]; .machine == "FG_4GT_2SX_V1_0")' machine/machines.json > /dev/null; then
            jq '. + [{"machine":"FG_4GT_2SX_V1_0","friendly_name":"广睿杰 GRJ-4GT-2SX V1.0","pcb":"FG_4GT_2SX_V1_0"}]' \
              machine/machines.json > /tmp/machines.json.tmp
            mv /tmp/machines.json.tmp machine/machines.json
            git add machine/machines.json
            git commit -m "chore: re-add FG_4GT_2SX_V1_0 to machines.json"
            echo "已补回 FG_4GT_2SX_V1_0"
          else
            echo "FG_4GT_2SX_V1_0 已存在，跳过"
          fi

          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无更新，跳过构建"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git log --oneline "$before"..HEAD
          fi

      - name: Push
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Trigger firmware build
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build-dotx.yml --ref main

      - name: Summary
        run: |
          {
            echo "### Sync result"
            echo ""
            echo "- changed: \`${{ steps.sync.outputs.changed }}\`"
            echo "- head: \`$(git log -1 --format='%h %s')\`"
          } >> "$GITHUB_STEP_SUMMARY"
