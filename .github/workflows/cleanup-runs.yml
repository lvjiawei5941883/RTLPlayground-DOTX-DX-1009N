name: Cleanup old workflow runs

on:
  schedule:
    - cron: '30 23 * * *'     # UTC 23:30 = 北京时间次日 07:30，紧跟在 07:00 构建之后
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MIN_KEEP: '1'     # 无论如何至少保留最新 1 条，防呆

    steps:
      - name: Delete runs older than today (Asia/Shanghai)
        run: |
          set -uo pipefail
          # 自然日边界：北京时间「今天 00:00」对应的 UTC 时间点
          cutoff=$(TZ=Asia/Shanghai date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          echo "cutoff (UTC) = $cutoff"

          gh run list --limit 500 \
            --json databaseId,createdAt,status,conclusion,workflowName \
            --jq '.[] | select(.status != "in_progress" and .status != "queued")
                       | "\(.databaseId)\t\(.createdAt)\t\(.workflowName)"' > /tmp/all.tsv

          total=$(wc -l < /tmp/all.tsv)
          echo "candidate runs: $total"
          {
            echo "### Cleanup old runs"
            echo ""
            echo "- cutoff: \`$cutoff\`"
            echo "- listed: $total"
          } >> "$GITHUB_STEP_SUMMARY"

          # gh run list 按时间倒序，先跳过最新 MIN_KEEP 条做保底
          tail -n +$((MIN_KEEP + 1)) /tmp/all.tsv \
            | awk -F'\t' -v c="$cutoff" '$2 < c {print $1"\t"$3}' > /tmp/del.tsv

          n=$(wc -l < /tmp/del.tsv)
          echo "to delete: $n"
          echo "- deleted: $n" >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r id name; do
            [ -z "$id" ] && continue
            echo "delete run $id ($name)"
            gh run delete "$id" || echo "  skip $id"
          done < /tmp/del.tsv
